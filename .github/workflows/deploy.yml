name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # anon key 是設計上公開的前端金鑰（真正的權限由資料庫 RLS 控制）
      VITE_SUPABASE_URL: https://uwgpoipjhqnxyayapbzh.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3Z3BvaXBqaHFueHlheWFwYnpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4Njg5ODksImV4cCI6MjEwMDQ0NDk4OX0.FAbaYltBApRYB7ioWn0Z62w-LZrWUTAAMmRgziWGR6c
      # ⚠️ 上鎖（改回登入）時：刪除下面這一行，並在 Supabase 執行 lock-mode.sql
      VITE_OPEN_MODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v4
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
